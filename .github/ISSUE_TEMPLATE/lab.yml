name: Lab proposal
description: Propose an exercise or a new system under test.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Learner and measurable outcome
      description: What should an engineer be able to demonstrate afterward?
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System, risk, and scenario
      description: Include prerequisites, setup/reset, and whether the scenario is intentionally vulnerable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance criteria
      description: What distinguishes meaningful verification from a passing but ineffective test?
    validations:
      required: true
