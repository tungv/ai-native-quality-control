name: Repository bug
description: Report a reproducible problem with a lab or tooling.
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Include lab, scenario, commit, environment, and commands. Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Distinguish a designed exercise failure from a repository defect.
    validations:
      required: true
