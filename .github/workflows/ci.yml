name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter:
    name: Starter baseline and fault detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Match the mounted checkout's Linux owner
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validate Compose and build both images
        run: |
          docker compose config --quiet
          docker compose build lab api
      - name: Verify reference behavior and deliberate fault detection in Docker
        run: docker compose run --rm -T lab make verify
      - name: Build a reviewable Linux binary inside the lab
        run: docker compose run --rm -T lab make build
      - name: Check the runtime image and published API port
        run: |
          docker compose up -d --wait api
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error http://127.0.0.1:8080/products/trail-shoes
      - name: Show API diagnostics on failure
        if: failure()
        run: docker compose logs api
      - name: Remove runtime containers
        if: always()
        run: docker compose down
      - name: Retain evidence and binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starter-evidence
          path: |
            reports/
            artifacts/
          if-no-files-found: warn
          retention-days: 7

  database:
    name: PostgreSQL vector contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test disposable database
        run: |
          docker compose up -d --wait db
          docker compose exec -T db psql -U learner -d playground -v ON_ERROR_STOP=1 -f /lab/tests.sql
      - name: Show database diagnostics on failure
        if: failure()
        run: docker compose logs db
      - name: Remove disposable database
        if: always()
        run: docker compose down
